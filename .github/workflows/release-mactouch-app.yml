name: Release MacTouchApp

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      APP_NAME: MacTouchApp
      APP_BUNDLE_ID: com.harsh180801.mactouch
      APP_ZIP: MacTouchApp-macos-arm64.zip
      APP_DMG: MacTouchApp-macos-arm64.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build release binary
        run: swift build -c release --product MacTouchApp

      - name: Assemble app bundle
        run: |
          set -euo pipefail
          mkdir -p "dist/${APP_NAME}.app/Contents/MacOS"
          cp ".build/release/${APP_NAME}" "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          chmod +x "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          cat > "dist/${APP_NAME}.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>${APP_BUNDLE_ID}</string>
            <key>CFBundleName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_REF_NAME}</string>
            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Import signing certificate
        env:
          APPLE_SIGNING_CERTIFICATE_P12: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_SIGNING_CERTIFICATE_P12}" || -z "${APPLE_SIGNING_CERTIFICATE_PASSWORD}" ]]; then
            echo "::error::Missing signing certificate secrets. Required: APPLE_SIGNING_CERTIFICATE_P12 and APPLE_SIGNING_CERTIFICATE_PASSWORD"
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/mactouch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 18)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "$APPLE_SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F\\\" '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::Developer ID Application identity not found in imported certificate."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Code sign app bundle
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "dist/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${APP_NAME}.app"

      - name: Build distributable archives
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/${APP_NAME}.app" "dist/${APP_ZIP}"
          hdiutil create -volname "${APP_NAME}" -srcfolder "dist/${APP_NAME}.app" -ov -format UDZO "dist/${APP_DMG}"

      - name: Configure notary API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER_ID}" || -z "${APPLE_API_PRIVATE_KEY}" ]]; then
            echo "::error::Missing notarization secrets. Required: APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_PRIVATE_KEY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Notarize dmg and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/${APP_DMG}" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/${APP_DMG}"
          xcrun stapler staple "dist/${APP_NAME}.app"

      - name: Validate notarized artifacts
        run: |
          set -euo pipefail
          xcrun stapler validate "dist/${APP_DMG}"
          spctl -a -t open --context context:primary-signature -v "dist/${APP_NAME}.app"

      - name: Cleanup signing keychain
        if: always()
        run: |
          set +e
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -rf "$RUNNER_TEMP/private_keys"

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.APP_DMG }}
            dist/${{ env.APP_ZIP }}
          generate_release_notes: true

      - name: Emit release guidance
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Release assets
          - `MacTouchApp-macos-arm64.dmg` (signed + notarized, recommended for end users)
          - `MacTouchApp-macos-arm64.zip` (signed app bundle archive)
          EOF
